# Render Blueprint for SupoClip.
#
# Two compute services, because the frontend and the media pipeline have
# nothing in common at runtime:
#
#   supoclip-web  API + video worker in one container. They must share the
#                 uploads disk, and a Render disk can only attach to a single
#                 service. Worker and API talk through Postgres + Redis.
#   supoclip-app  Next.js frontend (production Docker target).
#
# Postgres and Key Value are Render-managed. Media stays on the web service's
# disk (MEDIA_STORAGE=local); switch to MEDIA_STORAGE=s3 with a bucket if you
# ever split the worker onto its own service.
#
# First-time setup is in DEPLOY_RENDER.md: the Prisma migration has to run once
# against the database, and the two *.onrender.com URLs are baked into the
# frontend build.

databases:
  - name: supoclip-db
    databaseName: supoclip
    user: supoclip
    plan: free
    postgresMajorVersion: "17"

services:
  - type: keyvalue
    name: supoclip-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # API + worker. ffmpeg, torch and opencv live in this image, so it needs
  # real memory; 512 MB is not enough to render.
  - type: web
    name: supoclip-web
    runtime: docker
    region: oregon
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/db
    maxShutdownDelaySeconds: 300
    disk:
      name: media
      mountPath: /app/uploads
      sizeGB: 10
    dockerCommand: /bin/sh -c "export PYTHONPATH=/app; .venv/bin/python -m src.workers.run_workers & exec .venv/bin/uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    envVars:
      - key: TEMP_DIR
        value: /app/uploads
      - key: MEDIA_STORAGE
        value: local
      - key: SELF_HOST
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: supoclip-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: supoclip-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: supoclip-redis
          property: port
      # Secrets: set once in the Render dashboard after the Blueprint syncs.
      - key: ASSEMBLY_AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://velona.in/v1
      - key: LLM
        value: openai:deepseek/deepseek-v4-flash
      - key: TRANSCRIPTION_PROVIDER
        value: assemblyai
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BACKEND_AUTH_SECRET
        generateValue: true
      - key: APP_SETTINGS_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://supoclip-app.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://supoclip-app.onrender.com

  # Next.js frontend. The Dockerfile's final stage is the production runner.
  - type: web
    name: supoclip-app
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/auth/get-session
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SELF_HOST
        value: "true"
      - key: NEXT_PUBLIC_LANDING_ONLY_MODE
        value: "false"
      - key: DISABLE_SIGN_UP
        value: "false"
      # Baked into the browser bundle at build time. If Render assigns a
      # different onrender.com subdomain, update both of these and redeploy.
      - key: NEXT_PUBLIC_API_URL
        value: https://supoclip-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://supoclip-app.onrender.com
      - key: BETTER_AUTH_URL
        value: https://supoclip-app.onrender.com
      - key: BACKEND_INTERNAL_URL
        value: http://supoclip-web:10000
      - key: DATABASE_URL
        fromDatabase:
          name: supoclip-db
          property: connectionString
      # Same values as the API: Better Auth sessions are signed with the shared
      # secret, and the frontend signs its backend calls with BACKEND_AUTH_SECRET.
      - key: BETTER_AUTH_SECRET
        fromService:
          type: web
          name: supoclip-web
          envVarKey: BETTER_AUTH_SECRET
      - key: BACKEND_AUTH_SECRET
        fromService:
          type: web
          name: supoclip-web
          envVarKey: BACKEND_AUTH_SECRET
      - key: APP_SETTINGS_ENCRYPTION_KEY
        fromService:
          type: web
          name: supoclip-web
          envVarKey: APP_SETTINGS_ENCRYPTION_KEY
      - key: NEXT_PUBLIC_MAX_VIDEO_UPLOAD_BYTES
        value: "4000000000"
